<style>

/* all your CSS here */

/* ==========================================================
   ROOT VARIABLES
========================================================== */

:root{

    --primary:#0F6CBD;
    --primary-dark:#0A4E8A;

    --success:#16A34A;
    --warning:#F59E0B;
    --danger:#DC2626;

    --info:#2563EB;

    --white:#FFFFFF;

    --background:#F5F7FB;

    --border:#E5E7EB;

    --text:#1F2937;

    --text-light:#6B7280;

    --shadow:0 4px 12px rgba(0,0,0,.08);

    --radius:12px;

    --transition:.25s ease;

    --sidebar-width:260px;

}



/* ==========================================================
   RESET
========================================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

html{

    scroll-behavior:smooth;

    height:100%;

}

body{

    font-family:

        "Segoe UI",

        Roboto,

        Arial,

        sans-serif;

    background:var(--background);

    color:var(--text);

    overflow-x:hidden;

    min-height:100%;

}

/* ==========================================================
   LINKS
========================================================== */

a{

    text-decoration:none;

    color:inherit;

}



/* ==========================================================
   BUTTON RESET
========================================================== */

button{

    border:none;

    cursor:pointer;

    transition:var(--transition);

    font-family:inherit;

}



/* ==========================================================
   INPUT RESET
========================================================== */

input,
select,
textarea{

    font-family:inherit;

    outline:none;

}



/* ==========================================================
   IMAGES
========================================================== */

img{

    max-width:100%;

    display:block;

}



/* ==========================================================
   MAIN LAYOUT
========================================================== */

.main-container{

    display:flex;

    width:100%;

    min-height:100vh;

}



/* ==========================================================
   CONTENT
========================================================== */

.content{

    flex:1;

    padding:24px;

    overflow:auto;

}

/* ==========================================================
   HEADER
========================================================== */

.page-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

    flex-wrap:wrap;

    gap:15px;

}

.page-header h1{

    font-size:28px;

    color:var(--text);

}

.page-header p{

    color:var(--text-light);

    margin-top:5px;

}
/* ==========================================================
   CARD
========================================================== */

.card{

    background:var(--white);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    margin-bottom:20px;

    overflow:hidden;

}

.card-header{

    padding:18px 22px;

    border-bottom:1px solid var(--border);

    font-weight:600;

    font-size:17px;

}

.card-body{

    padding:22px;

}



/* ==========================================================
   GRID
========================================================== */

.form-grid{

    display:grid;

    grid-template-columns:

        repeat(auto-fit,minmax(260px,1fr));

    gap:18px;

}



/* ==========================================================
   FORM
========================================================== */

.form-group{

    display:flex;

    flex-direction:column;

}

.form-group label{

    margin-bottom:8px;

    font-weight:600;

}

.required{

    color:var(--danger);

}



/* ==========================================================
   INPUTS
========================================================== */

.form-control{

    width:100%;

    padding:12px 14px;

    border:1px solid var(--border);

    border-radius:8px;

    transition:var(--transition);

    font-size:14px;

    background:#fff;

}

.form-control:focus{

    border-color:var(--primary);

    box-shadow:0 0 0 3px rgba(15,108,189,.15);

}

textarea.form-control{

    resize:vertical;

    min-height:120px;

}



/* ==========================================================
   BUTTONS
========================================================== */

.primary-btn,

.secondary-btn,

.success-btn,

.danger-btn{

    padding:12px 18px;

    border-radius:8px;

    font-weight:600;

}

.primary-btn{

    background:var(--primary);

    color:#fff;

}

.primary-btn:hover{

    background:var(--primary-dark);

}

.secondary-btn{

    background:#ECEFF3;

}

.secondary-btn:hover{

    background:#DDE2E8;

}

.success-btn{

    background:var(--success);

    color:#fff;

}

.success-btn:hover{

    filter:brightness(.92);

}

.danger-btn{

    background:var(--danger);

    color:#fff;

}

.danger-btn:hover{

    filter:brightness(.92);

}



/* ==========================================================
   BUTTON ROW
========================================================== */

.button-row{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:20px;

}
/* ==========================================================
   SIDEBAR
========================================================== */

.sidebar{

    width:280px;

    min-width:280px;

    height:100vh;

    min-height:100%;

    align-self:stretch;

    position:sticky;

    top:0;

    left:0;

    display:flex;

    flex-direction:column;

    background:linear-gradient(
        180deg,
        #0B5ED7 0%,
        #0A58CA 100%
    );

    color:#FFFFFF;

    box-shadow:6px 0 24px rgba(0,0,0,.12);

    overflow:hidden;

}

/* ==========================================================
   LOGO
========================================================== */

.sidebar-logo{

    padding:28px 24px;

    text-align:center;

    border-bottom:1px solid rgba(255,255,255,.12);

}

.sidebar-logo-img{

    width:170px;

    max-width:100%;

    height:auto;

    display:block;

    margin:0 auto 16px;

}

.sidebar-title h1{

    margin:0;

    font-size:24px;

    font-weight:700;

    color:#FFFFFF;

    letter-spacing:.3px;

}

.sidebar-title p{

    margin:8px 0 0;

    font-size:14px;

    color:rgba(255,255,255,.85);

    line-height:1.5;

}

/* ==========================================================
   USER
========================================================== */

.sidebar-user{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:26px 20px;

    border-bottom:1px solid rgba(255,255,255,.12);

}

.user-avatar{

    width:78px;

    height:78px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(255,255,255,.18);

    border:3px solid rgba(255,255,255,.28);

    color:#FFFFFF;

    font-size:30px;

    font-weight:700;

    margin-bottom:16px;

    box-shadow:0 10px 24px rgba(0,0,0,.18);

}

.user-details{

    text-align:center;

    width:100%;

}

.user-name{

    font-size:18px;

    font-weight:700;

    color:#FFFFFF;

    line-height:1.4;

    word-break:break-word;

}

.user-role{

    margin-top:8px;

    display:inline-block;

    padding:6px 14px;

    border-radius:30px;

    background:rgba(255,255,255,.14);

    color:#FFFFFF;

    font-size:12px;

    font-weight:600;

    letter-spacing:.4px;

    text-transform:uppercase;

}
/* ==========================================================
   MENU
========================================================== */

.sidebar-menu{

    flex:1;

    padding:18px 14px;

    overflow-y:auto;

}

.sidebar-menu button{

    width:100%;

    display:flex;

    align-items:center;

    gap:14px;

    padding:14px 18px;

    margin-bottom:8px;

    border:none;

    border-radius:12px;

    background:transparent;

    color:#FFFFFF;

    cursor:pointer;

    font-size:15px;

    font-weight:500;

    text-align:left;

    transition:all .25s ease;

}

.sidebar-menu button .material-symbols-rounded{

    font-size:22px;

    flex-shrink:0;

}

.sidebar-menu button:hover{

    background:rgba(255,255,255,.12);

    transform:translateX(4px);

}

.sidebar-menu button.active{

    background:#FFFFFF;

    color:#0B5ED7;

    font-weight:600;

    box-shadow:0 8px 20px rgba(0,0,0,.15);

}

.sidebar-menu button.active .material-symbols-rounded{

    color:#0B5ED7;

}

/* ==========================================================
   FOOTER
========================================================== */

.sidebar-footer{

    padding:18px;

    border-top:1px solid rgba(255,255,255,.12);

}

.sidebar-version{

    text-align:center;

    color:rgba(255,255,255,.80);

    font-size:12px;

    margin-bottom:14px;

}

.sidebar-footer button{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    padding:13px;

    border:none;

    border-radius:12px;

    background:rgba(255,255,255,.14);

    color:#FFFFFF;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.25s ease;

}

.sidebar-footer button:hover{

    background:#FFFFFF;

    color:#D32F2F;

}

.sidebar-footer button:hover .material-symbols-rounded{

    color:#D32F2F;

}

/* ==========================================================
   SCROLLBAR
========================================================== */

.sidebar-menu::-webkit-scrollbar{

    width:6px;

}

.sidebar-menu::-webkit-scrollbar-thumb{

    background:rgba(255,255,255,.25);

    border-radius:20px;

}

/* ==========================================================
   RESPONSIVE
========================================================== */

@media (max-width:992px){

    .sidebar{

        width:250px;

        min-width:250px;

    }

}

@media (max-width:768px){

    .sidebar{

        position:fixed;

        z-index:1000;

        left:-100%;

        transition:left .30s ease;

    }

    .sidebar.open{

        left:0;

    }

}
/* ==========================================================
   LOGIN PAGE
========================================================== */

.login-container{

    display:flex;

    min-height:100vh;

    width:100%;

    background:linear-gradient(
    135deg,
    #0B5CAD 0%,
    #1976D2 45%,
    #42A5F5 100%
);

}

/* ===========================
   LEFT
=========================== */

.login-left{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:60px;

    color:#fff;

}

.login-brand{

    text-align:center;

    max-width:420px;

}

.login-brand{

    transform:translateY(-40px);

}
.login-left{

    position:relative;

    overflow:hidden;

}

.login-left::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        radial-gradient(circle at top left,
        rgba(255,255,255,.10),
        transparent 45%);

    pointer-events:none;

}

.login-brand img{

    width:260px;

    margin:0 auto 25px;

    filter:
    brightness(1.15)
    contrast(1.08)
    drop-shadow(0 0 12px rgba(255,255,255,.55))
    drop-shadow(0 12px 28px rgba(0,0,0,.25));

    transition:.3s ease;

}

.login-brand img:hover{

    transform:scale(1.03);

}

.login-brand h1{

    font-size:58px;

    font-weight:700;

    margin-bottom:12px;

    letter-spacing:-1px;

}

.login-brand h2{

    font-size:36px;

    line-height:1.35;

    margin-bottom:22px;

}

.login-brand p{

    font-size:19px;

    opacity:.92;

    letter-spacing:1px;

}

/* ===========================
   RIGHT
=========================== */

.login-right{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:60px;

    background:#F5F7FB;

}

/* ===========================
   CARD
=========================== */

.login-card{

    width:100%;

    max-width:550px;

    background:#fff;

    border-radius:18px;

    padding:48px;

    box-shadow:
    0 25px 60px rgba(15,108,189,.15);

}

.login-card h2{

    font-size:34px;

    margin-bottom:14px;

}

.login-card>p{

    margin-bottom:45px;

}

/* ===========================
   PASSWORD
=========================== */

.password-box{

    position:relative;

}

.password-box .form-control{

    padding-right:48px;

}

.password-toggle{

    position:absolute;

    top:50%;

    right:14px;

    transform:translateY(-50%);

    width:auto;

    height:auto;

    background:transparent;

    border:none;

    padding:0;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#7B8794;

    cursor:pointer;

    transition:.25s;

}

.password-toggle:hover{

    color:var(--primary);

    transform:translateY(-50%) scale(1.08);

}

/* ===========================
   REMEMBER
=========================== */

.remember-row{

    display:flex;

    justify-content:flex-start;

    align-items:center;

    margin:20px 0;

}

.remember-label{

    display:flex;

    align-items:center;

    gap:8px;

    font-size:15px;

    font-weight:500;

}

.remember-label input{

    width:16px;

    height:16px;

}

/* ===========================
   BUTTON
=========================== */

.login-card .primary-btn{

    width:100%;

    padding:15px;

    font-size:16px;

    transition:.25s ease;

}
.login-card .primary-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 10px 20px rgba(15,108,189,.30);

} 

/* ===========================
   ERROR
=========================== */

.login-error{

    margin-top:18px;

    padding:12px;

    background:#FEE2E2;

    color:#991B1B;

    border-radius:8px;

    text-align:center;

}

/* ===========================
   FOOTER
=========================== */

.login-footer{

    text-align:center;

    margin-top:25px;

    color:#9CA3AF;

    font-size:13px;

}

/* ===========================
   MOBILE
=========================== */

@media(max-width:992px){

    .login-container{

        flex-direction:column;

    }

    .login-left{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px 70px;

}

    }

    .login-brand img{

        width:170px;

    }

    .login-brand h1{

        font-size:42px;

    }

    .login-brand h2{

        font-size:26px;

    }

    .login-right{

        padding:30px;

    }

}

@media(max-width:576px){

    .login-left{

        padding:40px 20px;

    }

    .login-right{

        padding:20px;

    }

    .login-card{

        padding:28px;

    }

    .login-brand h1{

        font-size:34px;

    }

    .login-brand h2{

        font-size:22px;

    }

}
/* ==========================================================
   DASHBOARD CARDS
========================================================== */

.dashboard-cards{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

    gap:24px;

    margin-bottom:30px;

}

.dashboard-card{

    position:relative;

    background:#ffffff;

    border:1px solid #e8edf5;

    border-radius:16px;

    padding:24px;

    overflow:hidden;

    transition:all .25s ease;

    box-shadow:0 4px 18px rgba(15,23,42,.06);

    cursor:default;

}

.dashboard-card:hover{

    transform:translateY(-4px);

    box-shadow:0 14px 35px rgba(15,23,42,.12);

}

.dashboard-card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:5px;

}

.dashboard-card.total::before{

    background:#2563eb;

}

.dashboard-card.pending::before{

    background:#f59e0b;

}

.dashboard-card.approved::before{

    background:#16a34a;

}

.dashboard-card.rejected::before{

    background:#dc2626;

}

.card-title{

    font-size:14px;

    font-weight:600;

    color:#64748b;

    text-transform:uppercase;

    letter-spacing:.5px;

    margin-bottom:12px;

}

.card-value{

    font-size:42px;

    font-weight:700;

    line-height:1;

    color:#0f172a;

}

.dashboard-card.total{

    background:linear-gradient(180deg,#ffffff,#f8fbff);

}

.dashboard-card.pending{

    background:linear-gradient(180deg,#ffffff,#fffaf0);

}

.dashboard-card.approved{

    background:linear-gradient(180deg,#ffffff,#f5fff8);

}

.dashboard-card.rejected{

    background:linear-gradient(180deg,#ffffff,#fff6f6);

}
/* ==========================================================
   DASHBOARD GRID
========================================================== */

.dashboard-grid{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:24px;

    margin-bottom:30px;

}

@media(max-width:1100px){

    .dashboard-grid{

        grid-template-columns:1fr;

    }

}

/* ==========================================================
   DASHBOARD PANEL
========================================================== */

.dashboard-panel{

    background:#ffffff;

    border:1px solid #e8edf5;

    border-radius:16px;

    overflow:hidden;

    box-shadow:0 4px 18px rgba(15,23,42,.06);

    transition:.25s ease;

}

.dashboard-panel:hover{

    box-shadow:0 12px 32px rgba(15,23,42,.10);

}

.panel-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:18px 24px;

    background:#f8fafc;

    border-bottom:1px solid #edf2f7;

    font-size:16px;

    font-weight:700;

    color:#0f172a;

}

.panel-body{

    padding:18px 24px;

}
/* ==========================================================
   TABLE
========================================================== */

.table-responsive{

    width:100%;

    overflow-x:auto;

}

.table{

    width:100%;

    border-collapse:collapse;

    min-width:700px;

}

.table thead{

    background:#f8fafc;

}

.table th{

    padding:16px;

    text-align:left;

    font-size:13px;

    text-transform:uppercase;

    letter-spacing:.4px;

    color:#64748b;

    font-weight:700;

    border-bottom:2px solid #e2e8f0;

}

.table td{

    padding:16px;

    color:#334155;

    border-bottom:1px solid #edf2f7;

    vertical-align:middle;

}

.table tbody tr{

    transition:.2s ease;

}

.table tbody tr:hover{

    background:#f8fbff;

}

.table tbody tr:last-child td{

    border-bottom:none;

}
/* ==========================================================
   STATUS BADGES
========================================================== */

.status-badge{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:6px 12px;

    border-radius:30px;

    font-size:12px;

    font-weight:700;

}

.status-pending{

    background:#FEF3C7;

    color:#92400E;

}

.status-approved{

    background:#DCFCE7;

    color:#166534;

}

.status-rejected{

    background:#FEE2E2;

    color:#991B1B;

}

.status-review{

    background:#DBEAFE;

    color:#1D4ED8;

}



/* ==========================================================
   IMAGE PREVIEW
========================================================== */

.preview-grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

    gap:24px;

}

.image-preview{

    width:100%;

    height:260px;

    object-fit:contain;

    border:1px solid var(--border);

    border-radius:12px;

    background:#F8FAFC;

}



/* ==========================================================
   DETAILS GRID
========================================================== */

.details-grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

}

.details-grid label{

    display:block;

    font-size:13px;

    color:var(--text-light);

    margin-bottom:6px;

}

.details-grid p{

    font-weight:600;

    word-break:break-word;

}
/* ==========================================================
   NOTIFICATIONS
========================================================== */

.notification-list{

    display:flex;

    flex-direction:column;

    gap:18px;

}

.notification-item{

    background:#ffffff;

    border:1px solid #e8edf5;

    border-left:5px solid #2563eb;

    border-radius:14px;

    padding:18px;

    transition:.25s ease;

}

.notification-item:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 25px rgba(15,23,42,.08);

}

.notification-item.unread{

    border-left-color:#f59e0b;

    background:#fffdf7;

}

.notification-title{

    font-size:15px;

    font-weight:700;

    color:#0f172a;

    margin-bottom:8px;

}

.notification-message{

    font-size:14px;

    line-height:1.6;

    color:#64748b;

}

.notification-footer{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:16px;

    flex-wrap:wrap;

    gap:10px;

}

.notification-time{

    font-size:12px;

    color:#94a3b8;

}
/* ==========================================================
   UTILITIES
========================================================== */

.hidden{

    display:none !important;

}

.text-center{

    text-align:center;

}

.text-right{

    text-align:right;

}

.mt-10{

    margin-top:10px;

}

.mt-20{

    margin-top:20px;

}

.mb-20{

    margin-bottom:20px;

}
/* ==========================================================
   GLOBAL LOADER
========================================================== */

.loader-overlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    z-index:9999;

    background:linear-gradient(135deg,#0B5ED7,#2F80ED);

    backdrop-filter:blur(6px);

}

.loader-overlay.active{

    display:flex;

    animation:loaderFadeIn .35s ease;

}

.loader-box{

    width:500px;

    max-width:92%;

    background:#FFF;

    border-radius:24px;

    padding:55px 45px;

    text-align:center;

    box-shadow:0 25px 70px rgba(0,0,0,.20);

}

.loader-logo{

    width:160px;

    max-width:80%;

    height:auto;

    display:block;

    margin:0 auto 26px;

}

#loaderTitle{

    margin:0;

    font-size:34px;

    font-weight:700;

    color:#1F2937;

    line-height:1.2;

}

#loaderMessage{

    margin:18px 0 32px;

    font-size:18px;

    color:#6B7280;

    line-height:1.5;

}

.loader-dots{

    display:flex;

    justify-content:center;

    gap:10px;

    margin-bottom:28px;

}

.loader-dots span{

    width:14px;

    height:14px;

    border-radius:50%;

    background:#0B5ED7;

    animation:loaderDots 1.2s infinite ease-in-out;

}

.loader-dots span:nth-child(2){

    animation-delay:.2s;

}

.loader-dots span:nth-child(3){

    animation-delay:.4s;

}

.loader-dots span:nth-child(4){

    animation-delay:.6s;

}

.loader-footer{

    font-size:13px;

    color:#9CA3AF;

    border-top:1px solid #E5E7EB;

    padding-top:16px;

}

@keyframes loaderDots{

    0%,80%,100%{

        transform:scale(.55);

        opacity:.4;

    }

    40%{

        transform:scale(1);

        opacity:1;

    }

}

@keyframes loaderFadeIn{

    from{

        opacity:0;

    }

    to{
