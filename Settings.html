<!-- ============================================================
     SETTINGS
============================================================= -->

<div id="settingsContainer" class="page-container">

    <!-- ===================================================== -->
    <!-- Header -->
    <!-- ===================================================== -->

    <div class="page-header">

        <div>

            <h1>

                Settings

            </h1>

            <p>

                Manage your account settings.

            </p>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- User Information -->
    <!-- ===================================================== -->

    <div class="card">

        <div class="card-header">

            Profile Information

        </div>

        <div class="card-body">

            <div class="form-grid">

                <div class="form-group">

                    <label>

                        Username

                    </label>

                    <input
                        type="text"
                        id="settingUsername"
                        class="form-control"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Rider Name

                    </label>

                    <input
                        type="text"
                        id="settingRiderName"
                        class="form-control"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Employee ID

                    </label>

                    <input
                        type="text"
                        id="settingEmployeeId"
                        class="form-control"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Role

                    </label>

                    <input
                        type="text"
                        id="settingRole"
                        class="form-control"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Zone

                    </label>

                    <input
                        type="text"
                        id="settingZone"
                        class="form-control"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Warehouse

                    </label>

                    <input
                        type="text"
                        id="settingWarehouse"
                        class="form-control"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        LM Hub

                    </label>

                    <input
                        type="text"
                        id="settingHub"
                        class="form-control"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Status

                    </label>

                    <input
                        type="text"
                        id="settingStatus"
                        class="form-control"
                        readonly>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- Change Password -->
    <!-- ===================================================== -->

    <div class="card">

        <div class="card-header">

            Change Password

        </div>

        <div class="card-body">

            <div class="form-grid">

                <div class="form-group">

                    <label>

                        Current Password

                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        class="form-control">

                </div>

                <div class="form-group">

                    <label>

                        New Password

                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        class="form-control">

                </div>

                <div class="form-group">

                    <label>

                        Confirm Password

                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control">

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- Actions -->
    <!-- ===================================================== -->

    <div class="button-row">

        <button
            id="btnChangePassword"
            class="primary-btn">

            Change Password

        </button>

        <button
            id="btnLogoutSettings"
            class="secondary-btn">

            Logout

        </button>

    </div>

</div>
