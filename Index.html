  <script>
  (function () {
    function fixMobileScale() {
      var w = document.documentElement.clientWidth;
      var deviceW = window.screen.width;
      if (w > deviceW + 60) {
        var ratio = deviceW / w;
        document.body.style.transformOrigin = "top left";
        document.body.style.transform = "scale(" + ratio + ")";
        document.body.style.width = (100 / ratio) + "%";
      }
    }
    window.addEventListener("load", fixMobileScale);
    window.addEventListener("resize", fixMobileScale);
    window.addEventListener("orientationchange", fixMobileScale);
  })();
  </script>
